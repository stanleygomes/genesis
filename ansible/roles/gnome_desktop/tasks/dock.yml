---
# The MacOS Dock extension was dropped in favour of Ubuntu's stock dock.
# Machines provisioned by older genesis runs still carry the extension, its
# enabled/disabled-extensions entries and its dconf keys, so revert them here.
# Every step probes first, keeping a second run free of changes.
- name: Remove legacy MacOS Dock extension directory
  ansible.builtin.file:
    path: "{{ gnome_desktop_dock_legacy_extension_dir }}"
    state: absent
  become: false

# Reading via gsettings preserves distro default extensions even when
# /org/gnome/shell/enabled-extensions has never been written to dconf.
- name: Read GNOME Shell enabled extensions for Ubuntu Dock
  ansible.builtin.command: gsettings get org.gnome.shell enabled-extensions
  register: gnome_desktop_dock_enabled_extensions_raw
  failed_when: false
  changed_when: false
  check_mode: false
  become: false
  when: gnome_desktop_gnome_tools_check.rc == 0

- name: Read GNOME Shell disabled extensions for Ubuntu Dock
  ansible.builtin.command: gsettings get org.gnome.shell disabled-extensions
  register: gnome_desktop_dock_disabled_extensions_raw
  failed_when: false
  changed_when: false
  check_mode: false
  become: false
  when: gnome_desktop_gnome_tools_check.rc == 0

- name: Parse GNOME Shell extension lists for Ubuntu Dock
  ansible.builtin.set_fact:
    gnome_desktop_dock_enabled_extensions: >-
      {{ (gnome_desktop_dock_enabled_extensions_raw.stdout | trim | from_yaml)
         if (gnome_desktop_dock_enabled_extensions_raw.rc == 0
             and (gnome_desktop_dock_enabled_extensions_raw.stdout | trim | length > 0)
             and not (gnome_desktop_dock_enabled_extensions_raw.stdout | trim).startswith('@as'))
         else [] }}
    gnome_desktop_dock_disabled_extensions: >-
      {{ (gnome_desktop_dock_disabled_extensions_raw.stdout | trim | from_yaml)
         if (gnome_desktop_dock_disabled_extensions_raw.rc == 0
             and (gnome_desktop_dock_disabled_extensions_raw.stdout | trim | length > 0)
             and not (gnome_desktop_dock_disabled_extensions_raw.stdout | trim).startswith('@as'))
         else [] }}
  when: gnome_desktop_gnome_tools_check.rc == 0

# Drop the legacy UUID from both lists (the extension is gone) and make sure
# Ubuntu Dock is enabled and not listed as disabled.
- name: Compute desired GNOME Shell extension lists for Ubuntu Dock
  ansible.builtin.set_fact:
    gnome_desktop_dock_desired_enabled_extensions: >-
      {{ (gnome_desktop_dock_enabled_extensions
          | reject('equalto', gnome_desktop_dock_legacy_extension_uuid)
          | list) + ([] if gnome_desktop_dock_ubuntu_dock_uuid in gnome_desktop_dock_enabled_extensions
                     else [gnome_desktop_dock_ubuntu_dock_uuid]) }}
    gnome_desktop_dock_desired_disabled_extensions: >-
      {{ gnome_desktop_dock_disabled_extensions
         | reject('in', [gnome_desktop_dock_legacy_extension_uuid, gnome_desktop_dock_ubuntu_dock_uuid])
         | list }}
  when: gnome_desktop_gnome_tools_check.rc == 0

# Write extension state via dconf instead of gnome-extensions enable/disable:
# it works without a running Shell and Wayland only reloads it at login anyway.
- name: Update GNOME Shell disabled extensions for Ubuntu Dock
  community.general.dconf:
    key: /org/gnome/shell/disabled-extensions
    value: >-
      {{ '[' ~ (gnome_desktop_dock_desired_disabled_extensions | map('to_json') | join(', ') | replace('"', "'")) ~ ']'
         if gnome_desktop_dock_desired_disabled_extensions | length > 0 else '@as []' }}
    state: present
  become: false
  when:
    - gnome_desktop_gnome_tools_check.rc == 0
    - gnome_desktop_dock_disabled_extensions_raw.rc == 0
    - ansible_env.DBUS_SESSION_BUS_ADDRESS is defined
    - gnome_desktop_dock_desired_disabled_extensions != gnome_desktop_dock_disabled_extensions

- name: Update GNOME Shell enabled extensions for Ubuntu Dock
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    value: >-
      {{ '[' ~ (gnome_desktop_dock_desired_enabled_extensions | map('to_json') | join(', ') | replace('"', "'")) ~ ']'
         if gnome_desktop_dock_desired_enabled_extensions | length > 0 else '@as []' }}
    state: present
  become: false
  when:
    - gnome_desktop_gnome_tools_check.rc == 0
    - gnome_desktop_dock_enabled_extensions_raw.rc == 0
    - ansible_env.DBUS_SESSION_BUS_ADDRESS is defined
    - gnome_desktop_dock_desired_enabled_extensions != gnome_desktop_dock_enabled_extensions

# Only the macosdock schema was ever written by genesis; dash-to-dock keys
# (position, icon size, auto-hide) come from GNOME Settings and stay untouched.
- name: Check for leftover MacOS Dock dconf keys
  ansible.builtin.command:
    argv:
      - dconf
      - list
      - "{{ gnome_desktop_dock_legacy_dconf_dir }}"
  register: gnome_desktop_dock_legacy_dconf_keys
  failed_when: false
  changed_when: false
  check_mode: false
  become: false
  when: gnome_desktop_gnome_tools_check.rc == 0

- name: Reset leftover MacOS Dock dconf keys
  ansible.builtin.command:
    argv:
      - dconf
      - reset
      - -f
      - "{{ gnome_desktop_dock_legacy_dconf_dir }}"
  changed_when: true
  become: false
  when:
    - gnome_desktop_gnome_tools_check.rc == 0
    - ansible_env.DBUS_SESSION_BUS_ADDRESS is defined
    - gnome_desktop_dock_legacy_dconf_keys.rc == 0
    - gnome_desktop_dock_legacy_dconf_keys.stdout | trim | length > 0
