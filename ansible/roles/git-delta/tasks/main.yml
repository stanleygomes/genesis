---
# git-delta provides syntax-highlighting pager for git, diff, and grep output.

- name: Check if delta is installed
  command: which delta
  register: delta_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install git-delta via GitHub Release
  block:
    - name: Fetch version and download git-delta deb package
      shell: |
        DELTA_VERSION=$(curl -s "https://api.github.com/repos/dandavison/delta/releases/latest" | grep -Po '"tag_name": "\K[^"]*')
        if [ -z "$DELTA_VERSION" ]; then
          echo "Failed to get git-delta version (API limit?). Retrying with fallback version {{ git_delta_fallback_version }}"
          DELTA_VERSION="{{ git_delta_fallback_version }}"
        fi
        curl -sLo /tmp/git-delta.deb "https://github.com/dandavison/delta/releases/download/${DELTA_VERSION}/git-delta_${DELTA_VERSION}_amd64.deb"
      args:
        executable: /bin/bash
      become: false

    - name: Install git-delta deb package
      apt:
        deb: "/tmp/git-delta.deb"
      become: true

    - name: Clean up temporary deb file
      file:
        path: "/tmp/git-delta.deb"
        state: absent
      become: false
  when: delta_check.rc != 0


# Configure git to use delta as the pager globally
- name: Configure Git to use delta as pager
  git_config:
    name: core.pager
    value: delta
    scope: global
  become: false

# Enable color output when running interactive diffs
- name: Configure Git interactive diff filter to use delta
  git_config:
    name: interactive.diffFilter
    value: "delta --color-only"
    scope: global
  become: false

# Use delta's navigate mode to easily jump between files in diffs
- name: Enable delta navigate mode
  git_config:
    name: delta.navigate
    value: "true"
    scope: global
  become: false

# Set up side-by-side or styled diffs for merge conflicts
- name: Configure Git merge conflict style for delta
  git_config:
    name: merge.conflictstyle
    value: diff3
    scope: global
  become: false
