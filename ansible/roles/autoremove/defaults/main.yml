---
# List of APT packages to purge
autoremove_apt_packages:
  - firefox
  - filezilla
  - git-delta
  - claude-desktop
  - ghostty


# List of Flatpak packages to remove
autoremove_flatpak_packages: []

# List of Snap packages to remove
autoremove_snap_packages: []

# List of global NPM packages to remove
autoremove_npm_packages:
  - "@anthropic-ai/claude-code"
  - "@anthropic-ai/claude-cli"
  - "claude-code"

# List of desktop shortcut filenames to remove from ~/.local/share/applications/
autoremove_desktop_entries:
  - antigravity-ide.desktop
  - antigravity-url-handler.desktop
  - claude-code-url-handler.desktop
  - claude.desktop
  - com.mitchellh.ghostty.desktop
  - ghostty.desktop

# List of custom paths (directories or files) to remove as superuser (become: true)
autoremove_custom_paths:
  - /usr/local/bin/xh
  - /usr/local/bin/lazydocker
  - /usr/local/bin/claude
  - /usr/bin/claude
  - /usr/share/antigravity-ide
  - /usr/bin/antigravity-ide
  - /usr/bin/antigravity
  - /usr/share/pixmaps/antigravity-ide.png
  - /etc/apt/sources.list.d/claude-desktop.list
  - /usr/share/keyrings/claude-desktop-archive-keyring.asc
  - /etc/apt/sources.list.d/debian-griffo-io.list
  - /etc/apt/keyrings/debian-griffo-io.asc


# List of user-space paths (directories or files) to remove (become: false)
autoremove_user_paths:
  - "{{ ansible_env.HOME }}/.config/nvim"
  - "{{ ansible_env.HOME }}/.local/share/nvim"
  - "{{ ansible_env.HOME }}/.local/state/nvim"
  - "{{ ansible_env.HOME }}/.cache/nvim"
  - "{{ ansible_env.HOME }}/.config/Antigravity IDE"
  - "{{ ansible_env.HOME }}/.antigravity"
  - "{{ ansible_env.HOME }}/.config/Claude"
  - "{{ ansible_env.HOME }}/.local/bin/claude"
  - "{{ ansible_env.HOME }}/.local/share/claude"
  - "{{ ansible_env.HOME }}/.cache/claude"
  - "{{ ansible_env.HOME }}/.local/state/claude"
  - "{{ ansible_env.HOME }}/.claude.json"
  - "{{ ansible_env.HOME }}/.config/gideon"
  - "{{ ansible_env.HOME }}/.config/ghostty"

