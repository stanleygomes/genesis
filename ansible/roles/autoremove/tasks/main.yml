---
# === APT PACKAGES ===
- name: Remove APT packages
  apt:
    name: "{{ autoremove_apt_packages }}"
    state: absent
    purge: true
  become: true
  when: autoremove_apt_packages | default([]) | length > 0

- name: Autoremove unused APT dependencies
  apt:
    autoremove: true
    purge: true
  become: true
  when: autoremove_apt_packages | default([]) | length > 0

# === FLATPAK PACKAGES ===
- name: Remove Flatpak packages
  community.general.flatpak:
    name: "{{ item }}"
    state: absent
  loop: "{{ autoremove_flatpak_packages | default([]) }}"
  become: true
  when: autoremove_flatpak_packages | default([]) | length > 0

# === SNAP PACKAGES ===
- name: Remove Snap packages
  community.general.snap:
    name: "{{ item }}"
    state: absent
  loop: "{{ autoremove_snap_packages | default([]) }}"
  become: true
  when: autoremove_snap_packages | default([]) | length > 0

# === NPM PACKAGES ===
- name: Remove global NPM packages
  shell: |
    if [ -f "{{ ansible_env.HOME }}/.nvm/nvm.sh" ]; then
      source "{{ ansible_env.HOME }}/.nvm/nvm.sh"
    fi
    removed=0
    if command -v npm >/dev/null 2>&1 && npm list -g --depth=0 "{{ item }}" >/dev/null 2>&1; then
      npm uninstall -g "{{ item }}"
      removed=1
    fi
    if command -v pnpm >/dev/null 2>&1 && pnpm list -g --depth=0 "{{ item }}" >/dev/null 2>&1; then
      pnpm remove -g "{{ item }}"
      removed=1
    fi
    if [ "$removed" -eq 1 ]; then
      echo "uninstalled"
    fi
  args:
    executable: /bin/bash
  register: npm_uninstall_result
  changed_when: "'uninstalled' in npm_uninstall_result.stdout"
  loop: "{{ autoremove_npm_packages | default([]) }}"
  become: false
  when: autoremove_npm_packages | default([]) | length > 0

# === DESKTOP ENTRIES & SHORTCUTS ===
- name: Remove desktop entries
  file:
    path: "{{ ansible_env.HOME }}/.local/share/applications/{{ item }}"
    state: absent
  loop: "{{ autoremove_desktop_entries | default([]) }}"
  become: false
  when: autoremove_desktop_entries | default([]) | length > 0

# === CUSTOM SYSTEM PATHS & FILES (sudo) ===
- name: Remove custom system directories and files
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ autoremove_custom_paths | default([]) }}"
  become: true
  when: autoremove_custom_paths | default([]) | length > 0

# === USER PATHS & FILES (normal user) ===
- name: Remove user directories and files
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ autoremove_user_paths | default([]) }}"
  become: false
  when: autoremove_user_paths | default([]) | length > 0

- name: Clean up obsolete Gideon function from .zshrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} GIDEON CLI FUNCTION"
    state: absent
  become: false
