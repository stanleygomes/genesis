---
# Atuin replaces your default shell history with a SQLite database and records
# additional context for your commands.
- name: Check if Atuin is installed
  stat:
    path: "{{ ansible_env.HOME }}/.atuin/bin/atuin"
  register: atuin_stat
  become: false

# We fetch and run the official setup script to install Atuin locally in the user's home folder.
- name: Install Atuin via setup script
  shell: curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive
  become: false
  when: not atuin_stat.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"

# bash-preexec is required to capture command start and end times in Bash shell history.
- name: Download bash-preexec for Atuin
  get_url:
    url: https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh
    dest: "{{ ansible_env.HOME }}/.bash-preexec.sh"
    mode: "0644"
  become: false

# Remove any lines appended by the installer to avoid duplicate initialization entries.
- name: Remove unmanaged Atuin lines from shell configuration files
  lineinfile:
    path: "{{ ansible_env.HOME }}/{{ item.file }}"
    line: "{{ item.line }}"
    state: absent
  become: false
  loop: "{{ atuin_unmanaged_lines }}"

# Add the standard Atuin initialization block at the end of shell configurations.
- name: Add Atuin initialization to shell configuration files
  blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item.file }}"
    marker: "# {mark} ATUIN CONFIGURATION"
    insertafter: EOF
    block: |
      # Atuin history search
      . "$HOME/.atuin/bin/env"
      {{ item.preexec | default('') }}
      eval "$(atuin init {{ item.shell }})"
    state: present
  become: false
  loop: "{{ atuin_shells }}"
