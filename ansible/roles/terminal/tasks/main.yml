---
- name: Install terminal utilities (bat, btop, jq, git-delta)
  apt:
    name:
      - bat
      - btop
      - jq
      - zsh
      - git-delta
    state: present
  become: true

- name: Configure Git to use delta as pager
  git_config:
    name: core.pager
    value: delta
    scope: global
  become: false

- name: Configure Git interactive diff filter to use delta
  git_config:
    name: interactive.diffFilter
    value: "delta --color-only"
    scope: global
  become: false

- name: Enable delta navigate mode
  git_config:
    name: delta.navigate
    value: "true"
    scope: global
  become: false

- name: Configure Git merge conflict style for delta
  git_config:
    name: merge.conflictstyle
    value: diff3
    scope: global
  become: false

- name: Create directory for eza key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add eza GPG key
  shell: curl -fsSL https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor --yes -o /etc/apt/keyrings/gierens.gpg
  become: true

- name: Add eza repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
    state: present
    filename: gierens
    update_cache: no
  become: true

- name: Update apt cache manually (ignoring unreachable repos)
  shell: apt-get update || true
  become: true
  changed_when: false

- name: Install eza
  apt:
    name: eza
    state: present
  become: true

- name: Install Dust binary
  shell: |
    DUST_VERSION=$(curl -s "https://api.github.com/repos/bootandy/dust/releases/latest" | grep -Po '"tag_name": "v\K[^"]*')
    if [ -z "$DUST_VERSION" ]; then
      echo "Failed to get dust version. Retrying with fallback version 1.2.4"
      DUST_VERSION="1.2.4"
    fi
    curl -sLo /tmp/dust.tar.gz "https://github.com/bootandy/dust/releases/download/v${DUST_VERSION}/dust-v${DUST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    cd /tmp
    tar xf dust.tar.gz
    install dust-v${DUST_VERSION}-x86_64-unknown-linux-gnu/dust /usr/local/bin
  args:
    executable: /bin/bash
    creates: /usr/local/bin/dust
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install fd-find
  apt:
    name: fd-find
    state: present
  become: true

- name: Install Starship
  shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    executable: /bin/bash
    creates: /usr/local/bin/starship
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install xh
  shell: curl -sfL https://raw.githubusercontent.com/ducaale/xh/master/install.sh | sh
  args:
    executable: /bin/sh
    creates: /usr/local/bin/xh
  environment:
    XH_BINDIR: /usr/local/bin
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check if Atuin is installed
  stat:
    path: "{{ ansible_env.HOME }}/.atuin/bin/atuin"
  register: atuin_stat
  become: false

- name: Install Atuin via setup script
  shell: curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive
  become: false
  when: not atuin_stat.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"

- name: Download bash-preexec for Atuin
  get_url:
    url: https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh
    dest: "{{ ansible_env.HOME }}/.bash-preexec.sh"
    mode: "0644"
  become: false

# --- ZSH Specific Setup ---

- name: Check if Oh My Zsh is installed
  stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: oh_my_zsh_stat
  become: false

- name: Install Oh My Zsh
  shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  become: false
  when: not oh_my_zsh_stat.stat.exists

- name: Set zsh as default shell
  user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: true

- name: Set Oh My Zsh theme
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    regexp: "^ZSH_THEME="
    line: 'ZSH_THEME="robbyrussell"'
  become: false

# --- Shared Configurations (Aliases) ---

- name: Add common aliases to .bashrc and .zshrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    marker: "# {mark} PERSONAL ALIASES"
    block: |
      # Alias para abrir um novo terminal no diretório atual
      alias terminal='{{ terminal_command }} --working-directory="$(pwd)" &'

      # Alias para o bat/cat (no Ubuntu o comando é batcat)
      alias bat='batcat'

      # Alias para o eza (substituto moderno do ls)
      alias ls='eza --icons'
      alias ll='eza -lh --icons --grid --group-directories-first'
      alias la='eza -a --icons'
      alias lt='eza --tree --icons'

      # Alias para o dust (substituto moderno do du)
      alias du='dust'

      # Alias para o fd (substituto moderno do find)
      alias fd='fdfind'

      # Aliases para Neovim
      alias vim='nvim'
      alias nano='nvim'
      alias vi='nvim'

      # Intercepta 'docker ps' para executar o lazydocker
      docker() {
          if [ "$1" = "ps" ]; then
              lazydocker
          else
              command docker "$@"
          fi
      }

      # Alias for installing/updating Genesis
      genesis() {
          curl -sSL https://raw.githubusercontent.com/stanleygomes/genesis/refs/heads/master/bootstrap.sh | bash
      }
    state: present
  become: false
  loop:
    - .bashrc
    - .zshrc

# --- Shell Specific Initializations ---

- name: Add tool initializations to .zshrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} TOOL INITIALIZATIONS"
    insertafter: EOF
    block: |
      # Node.js
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

      # PNPM
      export PNPM_HOME="$HOME/.local/share/pnpm"
      case ":$PATH:" in
        *":$PNPM_HOME:"*) ;;
        *) export PATH="$PNPM_HOME:$PATH" ;;
      esac

      # Go
      export PATH=$PATH:$HOME/.local/go/bin:$HOME/go/bin

      # Python
      export PATH="$HOME/.local/bin:$PATH"
  become: false

- name: Add Starship initialization to shell configuration files
  blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item.file }}"
    marker: "# {mark} STARSHIP CONFIGURATION"
    insertafter: EOF
    block: |
      # Starship prompt initialization
      eval "$(starship init {{ item.shell }})"
    state: present
  become: false
  loop:
    - { file: '.bashrc', shell: 'bash' }
    - { file: '.zshrc', shell: 'zsh' }

- name: Remove unmanaged Atuin lines from shell configuration files
  lineinfile:
    path: "{{ ansible_env.HOME }}/{{ item.file }}"
    line: "{{ item.line }}"
    state: absent
  become: false
  loop:
    - { file: '.bashrc', line: '. "$HOME/.atuin/bin/env"' }
    - { file: '.bashrc', line: '[[ -f ~/.bash-preexec.sh ]] && source ~/.bash-preexec.sh' }
    - { file: '.bashrc', line: 'eval "$(atuin init bash)"' }
    - { file: '.zshrc', line: '. "$HOME/.atuin/bin/env"' }
    - { file: '.zshrc', line: 'eval "$(atuin init zsh)"' }

- name: Add Atuin initialization to shell configuration files
  blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item.file }}"
    marker: "# {mark} ATUIN CONFIGURATION"
    insertafter: EOF
    block: |
      # Atuin history search
      . "$HOME/.atuin/bin/env"
      {{ item.preexec | default('') }}
      eval "$(atuin init {{ item.shell }})"
    state: present
  become: false
  loop:
    - { file: '.bashrc', shell: 'bash', preexec: '[[ -f ~/.bash-preexec.sh ]] && source ~/.bash-preexec.sh' }
    - { file: '.zshrc', shell: 'zsh' }

