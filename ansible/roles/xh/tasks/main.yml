---
# xh is a friendly and fast tool for sending HTTP requests (written in Rust).
# We fetch and run the official installer to put the binary under /usr/local/bin.
- name: Install xh
  shell: curl -sfL https://raw.githubusercontent.com/ducaale/xh/master/install.sh | sh
  args:
    executable: /bin/sh
    creates: /usr/local/bin/xh
  environment:
    XH_BINDIR: /usr/local/bin
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
