---
- name: Check if DBeaver is installed
  command: dpkg -s dbeaver-ce
  register: dbeaver_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install dependencies for DBeaver
  apt:
    name:
      - wget
      - gnupg
    state: present
  when: dbeaver_check.rc != 0

- name: Create directory for DBeaver key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: dbeaver_check.rc != 0

- name: Add DBeaver GPG key
  get_url:
    url: https://dbeaver.io/debs/dbeaver.gpg.key
    dest: /etc/apt/keyrings/dbeaver.asc
    mode: '0644'
  become: true
  when: dbeaver_check.rc != 0

- name: Add DBeaver repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/dbeaver.asc] https://dbeaver.io/debs/dbeaver-ce /"
    state: present
    filename: dbeaver
    update_cache: no
  become: true
  when: dbeaver_check.rc != 0

- name: Update apt cache manually (ignoring unreachable repos)
  shell: apt-get update || true
  become: true
  changed_when: false
  when: dbeaver_check.rc != 0

- name: Install DBeaver Community Edition
  apt:
    name: dbeaver-ce
    state: present
  when: dbeaver_check.rc != 0
