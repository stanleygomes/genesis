---
- name: Validate OpenBot architecture
  assert:
    that: ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: "OpenBot supports x86_64 and aarch64 Linux only."

- name: Install AppImage runtime dependency
  apt:
    name: fuse3
    state: present

- name: Ensure OpenBot installation directory exists
  file:
    path: "{{ openbot_install_dir }}"
    state: directory
    mode: '0755'
  become: false

- name: Check whether OpenBot is already installed
  stat:
    path: "{{ openbot_appimage_path }}"
  register: openbot_appimage
  become: false

- name: Download OpenBot AppImage
  get_url:
    url: "{{ openbot_release_url }}/OpenBot-{{ openbot_version }}-{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}.AppImage"
    dest: "{{ openbot_appimage_path }}"
    checksum: "sha256:{{ openbot_release_url }}/SHA256SUMS-linux{{ '-arm64' if ansible_architecture == 'aarch64' else '' }}.txt"
    mode: '0755'
  become: false
  when: not openbot_appimage.stat.exists

- name: Check whether AppArmor is installed
  stat:
    path: /etc/apparmor.d
  register: openbot_apparmor

- name: Install OpenBot AppArmor profile
  get_url:
    url: "https://raw.githubusercontent.com/nightly-labs/openbot/v{{ openbot_version }}/build/linux/openbot.apparmor"
    dest: /etc/apparmor.d/openbot
    mode: '0644'
  notify: Reload AppArmor
  when:
    - openbot_apparmor.stat.isdir | default(false)
    - (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('23.10', '>=')) or (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 13)

- name: Ensure user applications directory exists
  file:
    path: "{{ ansible_env.HOME }}/.local/share/applications"
    state: directory
    mode: '0755'
  become: false

- name: Create OpenBot desktop entry
  copy:
    dest: "{{ ansible_env.HOME }}/.local/share/applications/openbot.desktop"
    mode: '0644'
    force: false
    content: |
      [Desktop Entry]
      Name=OpenBot
      Comment=AI agent workspace
      Exec={{ openbot_appimage_path }} %U
      Terminal=false
      Type=Application
      Categories=Development;Utility;
  become: false
