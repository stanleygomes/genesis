---
# tuicr is a terminal UI for code reviews (cr)
- name: Install tuicr binary
  shell: |
    TUICR_VERSION=$(curl -s "https://api.github.com/repos/agavra/tuicr/releases/latest" | grep -Po '"tag_name": "v?\K[^"]*')
    if [ -z "$TUICR_VERSION" ]; then
      echo "Failed to get tuicr version. Retrying with fallback version {{ tuicr_fallback_version }}"
      TUICR_VERSION="{{ tuicr_fallback_version }}"
    fi
    curl -sLo /tmp/tuicr.tar.gz "https://github.com/agavra/tuicr/releases/download/v${TUICR_VERSION}/tuicr-${TUICR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    cd /tmp
    tar xf tuicr.tar.gz tuicr
    install tuicr /usr/local/bin
  args:
    executable: /bin/bash
    creates: /usr/local/bin/tuicr
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Configure Git alias for tuicr
  git_config:
    name: "alias.{{ tuicr_git_alias_name }}"
    value: "tuicr -w"
    scope: global
  become: false
  when: tuicr_configure_git_alias | default(true) | bool
