---
- name: Set download URLs based on architecture
  set_fact:
    antigravity_ide_url: "{{ 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.1.1-6123990880747520/linux-x64/Antigravity%20IDE.tar.gz' }}"

# === INSTALL ANTIGRAVITY IDE ===

- name: Ensure target Antigravity IDE installation directory is clean
  file:
    path: /usr/share/antigravity-ide
    state: absent
  become: true

- name: Create Antigravity IDE installation directory
  file:
    path: /usr/share/antigravity-ide
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Download and extract Antigravity IDE
  unarchive:
    src: "{{ antigravity_ide_url }}"
    dest: /usr/share/antigravity-ide
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
    owner: root
    group: root
  become: true

- name: Set permissions on Antigravity IDE chrome-sandbox
  file:
    path: /usr/share/antigravity-ide/chrome-sandbox
    mode: "4755"
    owner: root
    group: root
  become: true

- name: Create symlink in /usr/bin for Antigravity IDE
  file:
    src: /usr/share/antigravity-ide/bin/antigravity-ide
    dest: /usr/bin/antigravity-ide
    state: link
    force: yes
  become: true

# Point 'antigravity' directly to the IDE as requested by the user
- name: Create symlink in /usr/bin for Antigravity pointing to IDE
  file:
    src: /usr/share/antigravity-ide/bin/antigravity-ide
    dest: /usr/bin/antigravity
    state: link
    force: yes
  become: true

- name: Copy Antigravity IDE icon to pixmaps
  copy:
    src: /usr/share/antigravity-ide/resources/app/resources/linux/code.png
    dest: /usr/share/pixmaps/antigravity-ide.png
    remote_src: yes
    mode: "0644"
  become: true

# === CONFIGURATIONS & EXTENSIONS ===

- name: Create User config directory
  file:
    path: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User"
    state: directory
    mode: "0755"
  become: false

- name: Sync Antigravity settings
  copy:
    src: "{{ playbook_dir }}/../configs/ide/settings.json"
    dest: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User/settings.json"
    mode: "0644"
  become: false

- name: Sync Antigravity keybindings
  copy:
    src: "{{ playbook_dir }}/../configs/ide/keybindings.json"
    dest: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User/keybindings.json"
    mode: "0644"
  become: false

- name: Read extensions list
  set_fact:
    extensions: "{{ lookup('file', playbook_dir + '/../configs/ide/extensions.txt').splitlines() }}"
  become: false

- name: Install Antigravity extensions
  shell: antigravity-ide --install-extension {{ item }}
  loop: "{{ extensions }}"
  become: false
  register: ext_install
  changed_when: "'is already installed' not in ext_install.stdout"
  ignore_errors: true

# === DESKTOP ENTRIES ===

- name: Ensure applications directory exists
  file:
    path: "{{ ansible_env.HOME }}/.local/share/applications"
    state: directory
    mode: "0755"
  become: false

- name: Create Antigravity IDE desktop entry
  copy:
    dest: "{{ ansible_env.HOME }}/.local/share/applications/antigravity-ide.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Antigravity IDE
      Comment=Experience liftoff
      GenericName=Text Editor
      Exec=/usr/bin/antigravity-ide %F
      Icon=antigravity-ide
      Type=Application
      StartupNotify=false
      StartupWMClass=antigravity-ide
      Categories=TextEditor;Development;IDE;
      MimeType=application/x-antigravity-workspace;
      Actions=new-empty-window;
      Keywords=vscode;

      [Desktop Action new-empty-window]
      Name=New Empty Window
      Exec=/usr/bin/antigravity-ide --new-window %F
      Icon=antigravity-ide
  become: false

- name: Create Antigravity IDE URL Handler desktop entry
  copy:
    dest: "{{ ansible_env.HOME }}/.local/share/applications/antigravity-url-handler.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Antigravity IDE - URL Handler
      Comment=Experience liftoff
      GenericName=Text Editor
      Exec=/usr/bin/antigravity-ide --open-url %U
      Icon=antigravity-ide
      Type=Application
      NoDisplay=true
      StartupNotify=true
      Categories=Utility;TextEditor;Development;IDE;
      MimeType=x-scheme-handler/antigravity;
      Keywords=vscode;
  become: false
