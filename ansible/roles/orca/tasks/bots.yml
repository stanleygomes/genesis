---
# ~/.orca/bots é do Orca (pasta real: ele cria cada bot lá). Do Solomon vem só a alma:
# pra cada bot que já existe no Orca com o mesmo nome de uma pasta de bots/ do Solomon,
# o SOUL.md vira link pro repo (mudou no Orca, volta pro git). MEMORY.md, memory/,
# bot.json, AGENTS.md e CLAUDE.md ficam só no Orca. Bot que ainda não existe no Orca:
# crie lá com o nome da pasta e rode o genesis de novo.
- name: Link Orca bots' SOUL.md to the Solomon repo
  shell: |
    set -e
    dir="{{ orca_bots_link }}" src="{{ orca_bots_src }}"
    [ -d "$src" ] || { echo "no-src"; exit 0; }
    if [ -L "$dir" ]; then  # jeito antigo: a pasta inteira era link pro repo
      rm "$dir"
      echo "unlinked"
    fi
    mkdir -p "$dir"
    if [ -f "$src/.ai-memory.toml" ] && [ ! -L "$dir/.ai-memory.toml" ]; then
      ln -sfn "$src/.ai-memory.toml" "$dir/.ai-memory.toml"  # ai-memory: projeto orca-bots
      echo "linked:.ai-memory.toml"
    fi
    for soul in "$src"/*/SOUL.md; do
      name="$(basename "$(dirname "$soul")")"
      bot="$dir/$name"
      [ -f "$bot/bot.json" ] || { echo "missing:$name"; continue; }
      [ "$(readlink -f "$bot/SOUL.md")" = "$(readlink -f "$soul")" ] && continue
      [ -e "$bot/SOUL.md" ] && mv "$bot/SOUL.md" "$bot/SOUL.md.bak-$(date +%Y%m%d-%H%M%S)"
      ln -s "$soul" "$bot/SOUL.md"
      echo "linked:$name"
    done
  register: orca_bots
  changed_when: "'linked:' in orca_bots.stdout"
  become: false

- name: Warn about Solomon bots missing in Orca
  debug:
    msg: >-
      {{ 'Sem ' ~ orca_bots_src ~ ' (o role agents clona o Solomon): bots do Orca não ligados.'
      if orca_bots.stdout == 'no-src'
      else 'Crie no Orca (mesmo nome da pasta) e rode o genesis de novo: '
      ~ (orca_bots.stdout_lines | select('match', '^missing:') | map('regex_replace', '^missing:', '') | join(', ')) }}
  when: orca_bots.stdout == 'no-src' or 'missing:' in orca_bots.stdout
  become: false
