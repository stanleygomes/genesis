---
- name: Check if Terraform is installed
  command: terraform version
  register: terraform_installed
  ignore_errors: true
  changed_when: false
  become: false

- name: Check for unzip dependency
  command: dpkg -s unzip
  register: unzip_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install unzip
  apt:
    name: unzip
    state: present
  become: true
  when: unzip_check.rc != 0 and (terraform_installed.rc != 0 or terraform_version not in terraform_installed.stdout)

- name: Download Terraform zip
  get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ terraform_arch }}.zip"
    dest: "/tmp/terraform.zip"
    mode: '0644'
  when: terraform_installed.rc != 0 or terraform_version not in terraform_installed.stdout
  become: false

- name: Extract Terraform binary
  unarchive:
    src: "/tmp/terraform.zip"
    dest: "/usr/local/bin"
    remote_src: yes
    mode: '0755'
    owner: root
    group: root
  when: terraform_installed.rc != 0 or terraform_version not in terraform_installed.stdout
  become: true

- name: Clean up Terraform zip
  file:
    path: "/tmp/terraform.zip"
    state: absent
  when: terraform_installed.rc != 0 or terraform_version not in terraform_installed.stdout
  become: false
