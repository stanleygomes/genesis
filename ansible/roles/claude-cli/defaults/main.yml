---
# Defaults for claude-cli role
claude_cli_installer_url: "https://claude.ai/install.sh"
claude_cli_bin_dir: "{{ ansible_env.HOME | default(lookup('env', 'HOME')) }}/.local/bin"
claude_cli_bin_path: "{{ claude_cli_bin_dir }}/claude"
claude_cli_config_dir: "{{ ansible_env.HOME | default(lookup('env', 'HOME')) }}/.claude"
claude_cli_statusline_script_dest: "{{ claude_cli_config_dir }}/statusline-command.sh"
claude_cli_settings_dest: "{{ claude_cli_config_dir }}/settings.json"
