---
# Defaults for rust role
rust_installer_url: "https://sh.rustup.rs"
rust_installer_path: "/tmp/rustup-init.sh"
rust_cargo_home: "{{ ansible_env.HOME }}/.cargo"
rust_rustup_home: "{{ ansible_env.HOME }}/.rustup"
rust_rustup_bin: "{{ rust_cargo_home }}/bin/rustup"
rust_toolchain: "stable"
rust_profile: "default"
rust_components:
  - clippy
  - rustfmt
rust_shell_rc_path: "{{ ansible_env.HOME }}/.zshrc"
