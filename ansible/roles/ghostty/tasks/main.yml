---
- name: Check if Ghostty is installed
  command: which ghostty
  register: ghostty_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Add Ghostty PPA (Ubuntu)
  apt_repository:
    repo: 'ppa:mkasberg/ghostty-ubuntu'
    state: present
    update_cache: no
  become: true
  when:
    - ghostty_check.rc != 0
    - ansible_distribution == 'Ubuntu'

- name: Create directory for Ghostty key (Debian)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when:
    - ghostty_check.rc != 0
    - ansible_distribution == 'Debian'

- name: Download Ghostty Debian GPG key (Debian)
  get_url:
    url: https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
    dest: /etc/apt/keyrings/debian-griffo-io.asc
    mode: '0644'
  become: true
  when:
    - ghostty_check.rc != 0
    - ansible_distribution == 'Debian'

- name: Add Ghostty Debian repository (Debian)
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/debian-griffo-io.asc] https://debian.griffo.io/apt {{ ansible_distribution_release }} main"
    state: present
    filename: debian-griffo-io
    update_cache: no
  become: true
  when:
    - ghostty_check.rc != 0
    - ansible_distribution == 'Debian'

- name: Update apt cache manually (ignoring unreachable repos)
  shell: apt-get update || true
  become: true
  changed_when: false
  when: ghostty_check.rc != 0

- name: Install Ghostty
  apt:
    name: ghostty
    state: present
  become: true
  when: ghostty_check.rc != 0

# Create the config directory in user space so Ghostty can locate its custom configuration file
- name: Ensure Ghostty config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'
  become: false

# Apply the user's preferred visual theme so the terminal colors match the system workspace aesthetic
- name: Set Ghostty default theme
  lineinfile:
    path: "{{ ansible_env.HOME }}/.config/ghostty/config"
    regexp: "^theme\\s*="
    line: "theme = {{ ghostty_theme }}"
    create: yes
    mode: '0644'
  become: false

# Ensure new tabs and windows inherit the working directory of the active terminal
- name: Configure Ghostty window inherit working directory
  lineinfile:
    path: "{{ ansible_env.HOME }}/.config/ghostty/config"
    regexp: "^window-inherit-working-directory\\s*="
    line: "window-inherit-working-directory = {{ ghostty_window_inherit_working_directory | lower }}"
    create: yes
    mode: '0644'
  become: false

# Save and restore window state (tabs, splits, dimensions) on exit/launch
- name: Configure Ghostty window save state
  lineinfile:
    path: "{{ ansible_env.HOME }}/.config/ghostty/config"
    regexp: "^window-save-state\\s*="
    line: "window-save-state = {{ ghostty_window_save_state }}"
    create: yes
    mode: '0644'
  become: false
