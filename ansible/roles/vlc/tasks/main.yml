---
# Probing first preserves idempotency and avoids unnecessary package manager calls
- name: Check if VLC is installed
  command: dpkg -s {{ vlc_package }}
  register: vlc_check
  ignore_errors: true
  changed_when: false
  become: false

# VLC plays local media and network streams such as RTSP from IP cameras
- name: Install VLC
  apt:
    name: "{{ vlc_package }}"
    state: present
  become: true
  when: vlc_check.rc != 0
