---
- name: Check if Go is installed
  shell: |
    export PATH=$PATH:{{ ansible_env.HOME }}/.local/go/bin:{{ ansible_env.HOME }}/go/bin
    go version
  register: go_installed
  ignore_errors: true
  changed_when: false
  become: false

- name: Ensure .local directory exists
  file:
    path: "{{ ansible_env.HOME }}/.local"
    state: directory
    mode: '0755'
  become: false

- name: Download Go
  get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: "/tmp/go.tar.gz"
  when: go_installed.rc != 0 or go_version not in go_installed.stdout
  become: false

- name: Extract Go
  unarchive:
    src: "/tmp/go.tar.gz"
    dest: "{{ ansible_env.HOME }}/.local"
    remote_src: yes
  when: go_installed.rc != 0 or go_version not in go_installed.stdout
  become: false

- name: Ensure Go bin is in PATH via shell rc files
  lineinfile:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    line: 'export PATH=$PATH:{{ ansible_env.HOME }}/.local/go/bin:{{ ansible_env.HOME }}/go/bin'
    state: present
  become: false
  loop:
    - .bashrc
    - .zshrc

- name: Clean up Go tarball
  file:
    path: "/tmp/go.tar.gz"
    state: absent
  when: go_installed.rc != 0 or go_version not in go_installed.stdout
  become: false

- name: Check if golangci-lint is installed
  shell: |
    export PATH=$PATH:{{ ansible_env.HOME }}/.local/go/bin:{{ ansible_env.HOME }}/go/bin
    golangci-lint --version
  register: lint_installed
  ignore_errors: true
  changed_when: false
  become: false

- name: Install golangci-lint
  shell: |
    export PATH=$PATH:{{ ansible_env.HOME }}/.local/go/bin:{{ ansible_env.HOME }}/go/bin
    BIN_DIR=$(go env GOPATH)/bin
    if [ -z "$BIN_DIR" ] || [ "$BIN_DIR" = "/bin" ]; then BIN_DIR={{ ansible_env.HOME }}/go/bin; fi
    mkdir -p $BIN_DIR
    curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $BIN_DIR {{ golangci_lint_version }}
  when: lint_installed.rc != 0 or golangci_lint_version not in lint_installed.stdout
  become: false
  args:
    executable: /bin/bash
