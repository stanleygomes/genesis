---
- name: Install Python environment dependencies
  apt:
    name:
      - python3-venv
      - python3-pip
      - python-is-python3
    state: present
  become: true

- name: Check if uv is installed
  stat:
    path: "{{ ansible_env.HOME }}/.local/bin/uv"
  register: uv_stat
  become: false

- name: Install uv via official script
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  when: not uv_stat.stat.exists
  become: false
  args:
    executable: /bin/bash

- name: Ensure uv is in .zshrc
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: present
  become: false

- name: Install recommended Python version (3.14)
  shell: |
    export PATH="{{ ansible_env.HOME }}/.local/bin:$PATH"
    uv python install 3.14
  become: false
  register: python_install
  changed_when: "'Installed' in python_install.stdout"

- name: Create local symlinks for python and python3
  file:
    src: "{{ ansible_env.HOME }}/.local/bin/python3.14"
    dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
    state: link
  become: false
  loop:
    - python
    - python3

