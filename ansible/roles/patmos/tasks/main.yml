---
# Patmos replaces the official Isle .deb (purged by the autoremove role). It
# reuses the same extension UUID and ~/.local paths, so user settings (dconf)
# and data (~/.local/share/isle) carry over untouched.
- name: Check if Patmos source checkout exists
  ansible.builtin.stat:
    path: "{{ patmos_src_dir }}/.git"
  register: patmos_src_stat
  become: false

# Only clone on a fresh machine: an existing checkout is the owner's working
# tree and must never be reset or pulled by provisioning.
- name: Clone Patmos source checkout
  ansible.builtin.git:
    repo: "{{ patmos_repo_url }}"
    dest: "{{ patmos_src_dir }}"
    version: "{{ patmos_version }}"
    update: false
  become: false
  when: not patmos_src_stat.stat.exists

- name: Check if cargo is available for Patmos build
  ansible.builtin.stat:
    path: "{{ patmos_cargo_bin_dir }}/cargo"
  register: patmos_cargo_stat
  become: false

- name: Fail when cargo is missing for Patmos build
  ansible.builtin.fail:
    msg: >-
      cargo not found at {{ patmos_cargo_bin_dir }}/cargo.
      Run the rust role first (make run CONFIG=desktop or --tags rust).
  when:
    - not patmos_cargo_stat.stat.exists
    - not ansible_check_mode

# Probe build dependencies without sudo so `make patmos` can rebuild without
# asking for a password once they are installed.
- name: Check Patmos build dependencies
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - "{{ item }}"
  loop: "{{ patmos_build_packages }}"
  register: patmos_deps_probe
  failed_when: false
  changed_when: false
  check_mode: false
  become: false
  tags:
    - patmos_deps

- name: Install missing Patmos build dependencies
  ansible.builtin.apt:
    name: >-
      {{ patmos_deps_probe.results
         | rejectattr('stdout', 'search', 'install ok installed')
         | map(attribute='item') | list }}
    state: present
  register: patmos_deps_install
  become: true
  when: >-
    (patmos_deps_probe.results | default([])
     | rejectattr('stdout', 'search', 'install ok installed')
     | list | length) > 0
  tags:
    - patmos_deps

# Fingerprint the working tree (HEAD, tracked diff and untracked files) so
# local uncommitted edits also trigger a rebuild.
- name: Compute Patmos source fingerprint
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ patmos_src_dir }}"
    {
      git rev-parse HEAD
      git diff HEAD --binary
      git ls-files -z --others --exclude-standard \
        | xargs -0 -r sha256sum
    } | sha256sum | cut -d' ' -f1
  args:
    executable: /bin/bash
  register: patmos_fingerprint
  changed_when: false
  check_mode: false
  become: false
  when: patmos_src_stat.stat.exists or not ansible_check_mode

- name: Read installed Patmos fingerprint
  ansible.builtin.slurp:
    src: "{{ patmos_stamp_file }}"
  register: patmos_stamp
  failed_when: false
  become: false

- name: Check installed Isle binary for Patmos
  ansible.builtin.stat:
    path: "{{ patmos_isled_bin }}"
  register: patmos_isled_stat
  become: false

- name: Read installed GNOME extension metadata for Patmos
  ansible.builtin.slurp:
    src: "{{ patmos_extension_dir }}/metadata.json"
  register: patmos_metadata
  failed_when: false
  become: false

- name: Determine whether Patmos needs to be built and installed
  ansible.builtin.set_fact:
    patmos_needs_install: >-
      {{ (patmos_force_reinstall | bool)
         or (patmos_deps_install | default({}) is changed)
         or not patmos_isled_stat.stat.exists
         or ((patmos_metadata.content | default('') | b64decode)
             is not search('stanleygomes/patmos'))
         or ((patmos_stamp.content | default('') | b64decode | trim)
             != (patmos_fingerprint.stdout | default('')) ) }}

# install.sh builds with cargo, installs into ~/.local without root, restarts
# isled and enables the extension; it keeps existing user preferences.
- name: Build and install Patmos from local checkout
  ansible.builtin.command:
    argv:
      - ./install.sh
    chdir: "{{ patmos_src_dir }}"
  environment:
    PATH: "{{ patmos_cargo_bin_dir }}:{{ ansible_env.PATH }}"
  register: patmos_install_result
  changed_when: true
  become: false
  when: patmos_needs_install | bool

- name: Ensure Patmos fingerprint directory exists
  ansible.builtin.file:
    path: "{{ patmos_stamp_file | dirname }}"
    state: directory
    mode: "0755"
  become: false
  when: patmos_needs_install | bool

- name: Record installed Patmos fingerprint
  ansible.builtin.copy:
    content: "{{ patmos_fingerprint.stdout }}\n"
    dest: "{{ patmos_stamp_file }}"
    mode: "0644"
  become: false
  when:
    - patmos_needs_install | bool
    - patmos_fingerprint.stdout is defined

- name: Show Patmos install output and logout reminder
  ansible.builtin.debug:
    msg: >-
      {{ patmos_install_result.stdout_lines | default([])
         + ['GNOME Shell on Wayland only loads the updated extension after '
            ~ 'logging out and back in (isled was already restarted).'] }}
  when:
    - patmos_needs_install | bool
    - not ansible_check_mode
