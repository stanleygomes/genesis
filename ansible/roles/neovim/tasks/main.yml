---
- name: Install libfuse2 for AppImage support
  apt:
    name: libfuse2
    state: present
  become: true

- name: Check if Neovim is installed
  stat:
    path: /usr/local/bin/nvim
  register: nvim_bin
  become: false

- name: Download Neovim AppImage
  get_url:
    url: "{{ neovim_appimage_url }}"
    dest: /usr/local/bin/nvim
    mode: '0755'
    owner: root
    group: root
  become: true
  when: not nvim_bin.stat.exists

- name: Install packages needed for plugins (ripgrep, build-essential, unzip, tree-sitter-cli)
  apt:
    name:
      - ripgrep
      - build-essential
      - unzip
      - tree-sitter-cli
    state: present
  become: true

- name: Ensure Neovim configuration directories exist
  file:
    path: "{{ ansible_env.HOME }}/.config/nvim/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - lua
    - lua/config
    - lua/plugins
  become: false

- name: Copy Neovim init.lua configuration
  copy:
    src: init.lua
    dest: "{{ ansible_env.HOME }}/.config/nvim/init.lua"
    mode: '0644'
  become: false

- name: Copy Neovim config files
  copy:
    src: "lua/config/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/nvim/lua/config/{{ item }}"
    mode: '0644'
  loop:
    - lazy.lua
    - options.lua
    - keymaps.lua
    - autocmds.lua
  become: false

- name: Copy Neovim plugins files
  copy:
    src: lua/plugins/example.lua
    dest: "{{ ansible_env.HOME }}/.config/nvim/lua/plugins/example.lua"
    mode: '0644'
  become: false

- name: Copy Neovim colorscheme plugin file
  copy:
    src: lua/plugins/colorscheme.lua
    dest: "{{ ansible_env.HOME }}/.config/nvim/lua/plugins/colorscheme.lua"
    mode: '0644'
  become: false
- name: Add Neovim aliases to .zshrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} NEOVIM ALIASES"
    block: |
      # Aliases para Neovim
      alias vim='nvim'
      alias nano='nvim'
      alias vi='nvim'
    state: present
  become: false


