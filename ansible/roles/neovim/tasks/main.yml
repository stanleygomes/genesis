---
- name: Install libfuse2 for AppImage support
  apt:
    name: libfuse2
    state: present
  become: true

- name: Check if Neovim is installed
  stat:
    path: /usr/local/bin/nvim
  register: nvim_bin
  become: false

- name: Download Neovim AppImage
  get_url:
    url: "{{ neovim_appimage_url }}"
    dest: /usr/local/bin/nvim
    mode: '0755'
    owner: root
    group: root
  become: true
  when: not nvim_bin.stat.exists

- name: Install packages needed for plugins (ripgrep, build-essential, unzip, tree-sitter-cli)
  apt:
    name:
      - ripgrep
      - build-essential
      - unzip
      - tree-sitter-cli
    state: present
  become: true

- name: Ensure Neovim configuration directories exist
  file:
    path: "{{ ansible_env.HOME }}/.config/nvim/lua"
    state: directory
    mode: '0755'
  become: false

- name: Copy Neovim init.lua configuration
  copy:
    src: init.lua
    dest: "{{ ansible_env.HOME }}/.config/nvim/init.lua"
    mode: '0644'
  become: false

- name: Copy Neovim plugins.lua configuration
  copy:
    src: lua/plugins.lua
    dest: "{{ ansible_env.HOME }}/.config/nvim/lua/plugins.lua"
    mode: '0644'
  become: false

