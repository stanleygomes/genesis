---
# Clones (or updates) the Solomon repo into ~/.config/solomon and syncs its .agents
# (Skills, rules) into ~/.agents and ~/.claude. The Orca role links each bot's SOUL.md there.

- name: Create ~/.agents directory
  file:
    path: "{{ agents_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure ~/.config exists
  file:
    path: "{{ solomon_dir | dirname }}"
    state: directory
    mode: "0755"
  become: false

# A bot in Orca may edit its SOUL.md here (symlink): never discard local changes; dirty = skip pull.
- name: Clone or update Solomon in ~/.config/solomon
  shell: |
    set -e
    if [ ! -d "{{ solomon_dir }}/.git" ]; then
      git clone -q "{{ solomon_repo }}" "{{ solomon_dir }}" && echo cloned
    elif [ -n "$(git -C "{{ solomon_dir }}" status --porcelain)" ]; then
      echo dirty
    else
      before="$(git -C "{{ solomon_dir }}" rev-parse HEAD)"
      git -C "{{ solomon_dir }}" pull -q --ff-only
      [ "$before" = "$(git -C "{{ solomon_dir }}" rev-parse HEAD)" ] || echo updated
    fi
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
  register: solomon_clone
  changed_when: solomon_clone.stdout in ['cloned', 'updated']
  failed_when: false
  become: false

- name: Warn when Solomon could not be cloned or updated
  debug:
    msg: >-
      {{ 'Solomon em ' ~ solomon_dir ~ ' tem mudança local (provavelmente o SOUL.md editado
      por um bot do Orca): não atualizei; commite lá e rode de novo.' if solomon_clone.stdout == 'dirty'
      else 'Não consegui clonar/atualizar o Solomon (' ~ solomon_repo ~ '): confira a chave
      SSH do GitHub. ' ~ (solomon_clone.stderr | default('')) }}
  when: solomon_clone.rc != 0 or solomon_clone.stdout == 'dirty'
  become: false

- name: Check Solomon .agents directory
  stat:
    path: "{{ solomon_dir }}/.agents"
  register: solomon_agents
  become: false

- name: Resolve repository .agents directory
  set_fact:
    resolved_repo_agents_dir: "{{ solomon_dir ~ '/.agents' if solomon_agents.stat.exists else '' }}"
  become: false

- name: Sync skills into ~/.agents/skills
  copy:
    src: "{{ resolved_repo_agents_dir }}/skills/"
    dest: "{{ agents_dir }}/skills/"
    mode: "0755"
  become: false
  when: resolved_repo_agents_dir != ''

- name: Sync rules into ~/.agents/rules
  copy:
    src: "{{ resolved_repo_agents_dir }}/rules/"
    dest: "{{ agents_dir }}/rules/"
    mode: "0644"
  become: false
  when: resolved_repo_agents_dir != ''

- name: Check for a skills folder in ~/.agents
  stat:
    path: "{{ agents_dir }}/skills"
  register: agents_skills_stat
  become: false

- name: Check current state of ~/.claude/skills
  stat:
    path: "{{ claude_dir }}/skills"
  register: claude_skills_stat
  become: false

- name: Ensure ~/.claude directory exists
  file:
    path: "{{ claude_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Symlink ~/.claude/skills to ~/.agents/skills
  file:
    src: "{{ agents_dir }}/skills"
    dest: "{{ claude_dir }}/skills"
    state: link
  become: false
  when:
    - agents_skills_stat.stat.exists
    - not claude_skills_stat.stat.exists or claude_skills_stat.stat.islnk | default(false)

- name: Find rule files in ~/.agents/rules
  find:
    paths: "{{ agents_dir }}/rules"
    patterns: "*.md"
  register: agents_rule_files
  become: false

- name: Build rule sections
  set_fact:
    agents_rule_sections: "{{ agents_rule_sections | default([]) + ['### ' ~ (item.path | basename) ~ \"\\n\\n\" ~ lookup('file', item.path)] }}"
  loop: "{{ agents_rule_files.files | default([]) | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: false
  when: agents_rule_files.matched | default(0) > 0

- name: Sync rules into ~/.claude/CLAUDE.md
  blockinfile:
    path: "{{ claude_dir }}/CLAUDE.md"
    create: true
    mode: "0644"
    marker: "<!-- {mark} AGENTS RULES (auto-synced from ~/.agents/rules, do not edit by hand) -->"
    block: "{{ agents_rule_sections | join('\n\n') }}"
  become: false
  when: agents_rule_files.matched | default(0) > 0
