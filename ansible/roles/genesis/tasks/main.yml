---
- name: Install genesis CLI wrapper
  copy:
    dest: "{{ genesis_bin_path }}"
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/bash
      # Genesis CLI

      # Ensure uv is in PATH
      export PATH="$HOME/.local/bin:$PATH"

      cd "{{ genesis_repo_path }}" || {
          echo "Genesis repository not found at {{ genesis_repo_path }}"
          exit 1
      }

      exec uv run python -m cli.main "$@"
