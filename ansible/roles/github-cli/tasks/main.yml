---
# GitHub CLI (`gh`) from GitHub's official APT repository: the distro package lags
# many releases behind (Ubuntu 24.04 ships 2.45).
- name: Check if GitHub CLI is installed
  command: dpkg -s gh
  register: gh_check
  ignore_errors: true
  changed_when: false
  check_mode: false  # read-only probe: also runs under --check
  become: false

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download GitHub CLI GPG key
  # Always refresh the key so apt update never fails with NO_PUBKEY after rotation.
  get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
    force: true
  become: true
  changed_when: false

- name: Add GitHub CLI repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    state: present
    filename: github-cli
    update_cache: no
  become: true

- name: Update apt cache manually (ignoring unreachable repos)
  shell: apt-get update || true
  become: true
  changed_when: false
  when: gh_check.rc != 0

- name: Install GitHub CLI
  apt:
    name: gh
    state: present
  become: true
  when: gh_check.rc != 0
