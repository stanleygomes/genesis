---
- name: Install Diluvio script
  copy:
    src: diluvio.sh
    dest: "{{ diluvio_install_path }}"
    mode: "0755"
    owner: root
    group: root

- name: Check for existing Zsh configuration
  stat:
    path: "{{ ansible_env.HOME }}/.zshrc"
  become: false
  register: diluvio_zshrc

- name: Remove obsolete Diluvio alias
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} DILUVIO ALIAS"
    state: absent
  become: false
  when: diluvio_zshrc.stat.exists
