---
# Mirrors the proverbs repo (Skills, Agents, rules) into ~/.claude so Claude Code picks it up.
- name: Clone or update proverbs repository
  git:
    repo: "{{ proverbs_repo_url }}"
    dest: "{{ proverbs_dir }}"
    update: true
  become: false

- name: Check for a skills folder in the proverbs repo
  stat:
    path: "{{ proverbs_dir }}/skills"
  register: proverbs_skills_stat
  become: false

- name: Check current state of ~/.claude/skills
  stat:
    path: "{{ claude_dir }}/skills"
  register: claude_skills_stat
  become: false

- name: Symlink ~/.claude/skills to ~/.agents/skills
  file:
    src: "{{ proverbs_dir }}/skills"
    dest: "{{ claude_dir }}/skills"
    state: link
  become: false
  when:
    - proverbs_skills_stat.stat.exists
    - not claude_skills_stat.stat.exists or claude_skills_stat.stat.islnk | default(false)

- name: Find rule files in the proverbs repo
  find:
    paths: "{{ proverbs_dir }}/rules"
    patterns: "*.md"
  register: proverbs_rule_files
  become: false
  ignore_errors: true

- name: Build rule sections
  set_fact:
    proverbs_rule_sections: "{{ proverbs_rule_sections | default([]) + ['### ' ~ (item.path | basename) ~ \"\\n\\n\" ~ lookup('file', item.path)] }}"
  loop: "{{ proverbs_rule_files.files | default([]) | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: false
  when: proverbs_rule_files.matched | default(0) > 0

- name: Sync rules into ~/.claude/CLAUDE.md
  blockinfile:
    path: "{{ claude_dir }}/CLAUDE.md"
    create: true
    mode: "0644"
    marker: "<!-- {mark} PROVERBS RULES (auto-synced from ~/.agents/rules, do not edit by hand) -->"
    block: "{{ proverbs_rule_sections | join('\n\n') }}"
  become: false
  when: proverbs_rule_files.matched | default(0) > 0
