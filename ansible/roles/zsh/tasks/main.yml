---
- name: Install Zsh and basic terminal utilities (bat, btop, jq)
  apt:
    name:
      - bat
      - btop
      - jq
      - zsh
    state: present
  become: true

# --- ZSH Specific Setup ---

- name: Check if Oh My Zsh is installed
  stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: oh_my_zsh_stat
  become: false

- name: Install Oh My Zsh
  shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  become: false
  when: not oh_my_zsh_stat.stat.exists

- name: Check if user exists in /etc/passwd
  shell: grep -q "^{{ ansible_user_id }}:" /etc/passwd && echo "yes" || echo "no"
  register: user_in_passwd
  changed_when: false
  become: false

- name: Set Zsh as default shell via user module (for local users)
  user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: true
  when: user_in_passwd.stdout == "yes"

- name: Set Zsh as default shell via chsh (fallback for non-local/LDAP users)
  shell: chsh -s /usr/bin/zsh
  become: false
  when: user_in_passwd.stdout == "no"
  ignore_errors: true

# --- Shared Configurations (Aliases) ---

- name: Add common aliases to .zshrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} PERSONAL ALIASES"
    block: |
      # Alias para o bat/cat (no Ubuntu o comando é batcat)
      alias bat='batcat'

      # Alias for installing/updating Genesis
      genesis() {
          curl -sSL https://raw.githubusercontent.com/stanleygomes/genesis/refs/heads/master/bootstrap.sh | bash
      }
    state: present
  become: false
