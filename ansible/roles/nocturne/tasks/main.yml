---
# Check if flatpak is installed before attempting to manage Flatpak applications
- name: Check if Flatpak is installed
  command: which flatpak
  register: flatpak_check
  ignore_errors: true
  changed_when: false
  become: false

# Ensure the flatpak package manager is available on the host system
- name: Install Flatpak package manager
  apt:
    name: flatpak
    state: present
  become: true
  when: flatpak_check.rc != 0

# Flathub remote repository is required to resolve and download the application package
- name: Ensure Flathub repository is configured
  community.general.flatpak_remote:
    name: "{{ nocturne_flatpak_remote_name }}"
    flatpakrepo_url: "{{ nocturne_flatpak_remote_url }}"
    state: present
    method: system
  become: true

# Deploy the Nocturne Flatpak application from the Flathub repository
- name: Install Nocturne Flatpak application
  community.general.flatpak:
    name: "{{ nocturne_flatpak_app }}"
    remote: "{{ nocturne_flatpak_remote_name }}"
    state: present
    method: system
  become: true

# Ensure the application desktop shortcut is visible immediately in the user desktop menu
- name: Link Nocturne desktop entry to user applications
  file:
    src: "/var/lib/flatpak/exports/share/applications/{{ nocturne_flatpak_app }}.desktop"
    dest: "{{ ansible_env.HOME }}/.local/share/applications/{{ nocturne_flatpak_app }}.desktop"
    state: link
    force: yes
  become: false

# Ensure user icon directories exist so the icon can be resolved without a full session restart
- name: Ensure user icon directories exist
  file:
    path: "{{ ansible_env.HOME }}/.local/share/icons/hicolor/{{ item }}/apps"
    state: directory
    mode: "0755"
  loop:
    - scalable
    - symbolic
  become: false

# Link application icons to user-space icons directory for immediate GNOME Shell availability
- name: Link Nocturne icons to user icons directory
  file:
    src: "/var/lib/flatpak/exports/share/icons/hicolor/scalable/apps/{{ nocturne_flatpak_app }}.svg"
    dest: "{{ ansible_env.HOME }}/.local/share/icons/hicolor/scalable/apps/{{ nocturne_flatpak_app }}.svg"
    state: link
    force: yes
  become: false

# Update the local desktop application index to make the new entry searchable immediately
- name: Update user desktop database
  command: update-desktop-database "{{ ansible_env.HOME }}/.local/share/applications"
  changed_when: false
  become: false
