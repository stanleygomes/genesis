---
# ------------------------------------------------------------------------------
# Personal Information
# ------------------------------------------------------------------------------
user_name: "{{ git_user_name }}"
user_email: "{{ git_user_email }}"

# ------------------------------------------------------------------------------
# Optional Roles
# ------------------------------------------------------------------------------
# Mirrors the proverbs repo (Skills, Agents, rules) into ~/.claude. Off by
# default since it's a personal AI-harness preference, not core workstation setup.
install_proverbs: false

# ------------------------------------------------------------------------------
# Tool Versions
# ------------------------------------------------------------------------------
node_version: "24"
go_version: "1.26.2"
golangci_lint_version: "v2.11.4"
java_version: "25.0.1-zulu"

# ------------------------------------------------------------------------------
# Docker Configuration
# ------------------------------------------------------------------------------
docker_user: "{{ ansible_user_id }}"

# ------------------------------------------------------------------------------
# PHP Configuration
# ------------------------------------------------------------------------------
php_extensions:
  - "php-cli"
  - "php-fpm"
  - "php-common"
  - "php-mysql"
  - "php-xml"
  - "php-curl"
  - "php-mbstring"
  - "php-zip"
  - "php-gd"
  - "php-intl"
  - "php-bcmath"
  - "php-sqlite3"



