---
- name: My Custom Setup 1
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false
      tags:
        - always

    - name: Update apt cache (ignoring unreachable repos)
      shell: apt-get update || true
      become: true
      changed_when: false
  roles:
    - system
    - role: isle
      tags:
        - isle
    - google-chrome
    - node
    - mongodb-compass
    - mongosh
    - dbeaver
    - bruno
    - nocturne
    - java
    - python
    - openspec
    - agents
    - flameshot
    - orca
