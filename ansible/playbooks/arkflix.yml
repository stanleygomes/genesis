---
- name: Arkflix Media Server Provisioning
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - "../configs/arkflix/.env"

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false

    - name: Update apt cache (ignoring unreachable repos)
      shell: apt-get update || true
      become: true
      changed_when: false

  roles:
    - arkflix
