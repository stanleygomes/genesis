---
- name: Minimal configuration for get started
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false
      tags:
        - always

    - name: Update apt cache (ignoring unreachable repos)
      shell: apt-get update || true
      become: true
      changed_when: false

  roles:
    - role: autoremove
      tags:
        - autoremove
    - git
    - python
    - github-cli
    - cli-tools
    - playwright
    - zsh
    - diluvio
    - docker
    - oxker
    - terraform
    - gcloud-cli
    - todoist-cli
    - eza
    - dust
    - zellij
    - starship
    - atuin
    - tuicr
    - neovim
    - antigravity-cli
    - claude-cli
    - agents
    - herdr
    - ai-memory
