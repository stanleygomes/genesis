---
- name: Desktop Setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false

    - name: Update apt cache (ignoring unreachable repos)
      shell: apt-get update || true
      become: true
      changed_when: false
  roles:
    - system
    - google-chrome
    - github-cli
    - fonts
    - dbeaver
    - java
    - python
    - php
    - go
    - antigravity
    - vscode
    - postman
    - lazydocker
    - filezilla
    - ollama
    - opencode
    - desktop-entries
    - antigravity-cli
    - github-copilot
    - ghostty
