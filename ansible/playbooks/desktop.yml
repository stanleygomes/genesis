---
- name: My Custom Desktop Setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false

    - name: Update apt cache (ignoring unreachable repos)
      shell: apt-get update || true
      become: true
      changed_when: false
  roles:
    - autoremove
    - system
    - google-chrome
    - dbeaver
    - vscode
    - antigravity-cli
    - github-copilot
    - openspec
    - ghostty
    - nocturne
    - darktable
    - terraform
    - java
    - python
    - php
    - go
    - node
