---
- name: My Custom Desktop Setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false
      tags:
        - always

    - name: Update apt cache (ignoring unreachable repos)
      shell: apt-get update || true
      become: true
      changed_when: false
  roles:
    - role: autoremove
      tags:
        - autoremove
    - system
    - role: gnome_desktop
      tags:
        - gnome_desktop
    - google-chrome
    - dbeaver
    - vscode
    - node
    - antigravity-cli
    - openspec
    - agents
    - herdr
    - nocturne
    - artcraft
    - vlc
    - emulation
    - orca
    - java
    - python
    - php
    - go
    - role: rust
      tags:
        - rust
    - role: patmos
      tags:
        - patmos
