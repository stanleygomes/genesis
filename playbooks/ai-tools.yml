# @sub-options: antigravity-cli, github-copilot
---
- name: AI tools setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false

  roles:
    - { role: antigravity-cli, when: install_antigravity_cli | default(false) | bool }
    - { role: github-copilot, when: install_github_copilot | default(false) | bool }
