# @sub-options: gemini-cli, github-copilot, hermes-agent, claude-code, open-claw
---
- name: AI tools setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false

  roles:
    - { role: gemini-cli, when: install_gemini_cli | default(true) | bool }
    - { role: github-copilot, when: install_github_copilot | default(true) | bool }
    - { role: hermes-agent, when: install_hermes_agent | default(true) | bool }
    - { role: claude-code, when: install_claude_code | default(true) | bool }
    - { role: open-claw, when: install_open_claw | default(true) | bool }
