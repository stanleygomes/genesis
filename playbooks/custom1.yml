---
- name: Custom Setup 1
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts as normal user to set ansible_env correctly
      setup:
      become: false
  roles:
    - google-chrome
    - gnome-setup
    - fonts
    - mongodb-compass
    - docker
    - dbeaver
    - sdkman
    - pnpm
    - python-uv
    - go
    - bruno
    - github-copilot
    - lazygit
    - lazydocker
