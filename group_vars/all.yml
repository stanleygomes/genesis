---
# ------------------------------------------------------------------------------
# Personal Information
# ------------------------------------------------------------------------------
user_name: "{{ git_user_name }}"
user_email: "{{ git_user_email }}"

# ------------------------------------------------------------------------------
# Tool Versions
# ------------------------------------------------------------------------------
node_version: "24"
go_version: "1.26.2"
golangci_lint_version: "v2.11.4"
java_version: "25.0.1-zulu"

# ------------------------------------------------------------------------------
# Docker Configuration
# ------------------------------------------------------------------------------
docker_user: "{{ ansible_user_id }}"

# ------------------------------------------------------------------------------
# PHP Configuration
# ------------------------------------------------------------------------------
php_extensions:
  - "php-cli"
  - "php-fpm"
  - "php-common"
  - "php-mysql"
  - "php-xml"
  - "php-curl"
  - "php-mbstring"
  - "php-zip"
  - "php-gd"
  - "php-intl"
  - "php-bcmath"
  - "php-sqlite3"

# ------------------------------------------------------------------------------
# Desktop / TUI Apps Configuration
# ------------------------------------------------------------------------------
tui_apps:
  - name: "LazyDocker"
    exec: "lazydocker"
    icon: "docker"
    comment: "The simple terminal UI for both docker and docker-compose"
  - name: "Btop"
    exec: "btop"
    icon: "utilities-system-monitor"
    comment: "Resource monitor that shows usage and stats"
  - name: "OpenCode"
    exec: "opencode"
    icon: "utilities-terminal"
    comment: "OpenCode AI coding agent terminal UI"

