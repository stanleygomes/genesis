---
- name: Install genesis CLI wrapper
  copy:
    dest: "{{ genesis_bin_path }}"
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/bash
      # Genesis CLI

      set -e

      show_help() {
          echo "Usage: genesis [command]"
          echo ""
          echo "Commands:"
          echo "  (no args) Run the local installer"
          echo "  update    Update the workstation configuration using the one-liner bootstrap"
          echo "  help      Show this help message"
      }

      # Default behavior: run local installer if no arguments
      if [ "$#" -lt 1 ]; then
          if [ -f "{{ genesis_repo_path }}/bootstrap.sh" ]; then
              echo "🚀 Running local Genesis installer..."
              exec "{{ genesis_repo_path }}/bootstrap.sh"
          else
              show_help
              exit 1
          fi
      fi

      case "$1" in
          update)
              echo "🔄 Running Genesis update..."
              curl -sSL https://raw.githubusercontent.com/stanleygomes/genesis/refs/heads/master/bootstrap.sh | bash
              ;;
          help|-h|--help)
              show_help
              ;;
          *)
              echo "Unknown command: $1"
              show_help
              exit 1
              ;;
      esac
