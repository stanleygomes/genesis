---
- name: Check if claude is installed
  command: which claude
  register: claude_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install Claude Code
  shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  when: claude_check.rc != 0
  become: false
