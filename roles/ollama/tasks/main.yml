---
- name: Check if Ollama binary exists
  stat:
    path: /usr/bin/ollama
  register: ollama_bin_check
  become: false

- name: Install Ollama via official installer
  shell: curl -fsSL https://ollama.com/install.sh | sh
  become: true
  when: not ollama_bin_check.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure Ollama service is enabled and started
  systemd:
    name: ollama
    state: started
    enabled: true
  become: true
  when: not ansible_check_mode
