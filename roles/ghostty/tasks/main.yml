---
- name: Install Ghostty terminal emulator
  apt:
    name: ghostty
    state: present
    update_cache: yes
  become: true

- name: Ensure Ghostty config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'
  become: false

- name: Configure Ghostty settings
  copy:
    dest: "{{ ansible_env.HOME }}/.config/ghostty/config"
    content: |
      # Ghostty Configuration
      font-family = "{{ ghostty_font_family }}"
      font-size = {{ ghostty_font_size }}
      theme = {{ ghostty_theme }}
    mode: '0644'
  become: false

- name: Set Ghostty as default x-terminal-emulator
  community.general.alternatives:
    name: x-terminal-emulator
    path: /usr/bin/ghostty
    link: /usr/bin/x-terminal-emulator
    priority: 50
    state: selected
  become: true

