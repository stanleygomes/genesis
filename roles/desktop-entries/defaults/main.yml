---
tui_apps:
  - name: "LazyGit"
    exec: "lazygit"
    icon: "git"
    comment: "Terminal UI for git commands"
  - name: "LazyDocker"
    exec: "lazydocker"
    icon: "docker"
    comment: "The simple terminal UI for both docker and docker-compose"
  - name: "LazySQL"
    exec: "lazysql"
    icon: "database"
    comment: "Terminal UI for SQL databases"
  - name: "Harlequin"
    exec: "harlequin"
    icon: "database"
    comment: "The SQL IDE for your terminal"
  - name: "Posting"
    exec: "posting"
    icon: "network-server"
    comment: "The modern API client that lives in your terminal"
  - name: "Btop"
    exec: "btop"
    icon: "utilities-system-monitor"
    comment: "Resource monitor that shows usage and stats"
