---
- name: Get latest LazySQL version
  shell: |
    curl -s https://api.github.com/repos/jorgerojas26/lazysql/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/'
  register: lazysql_version
  changed_when: false
  become: false

- name: Download LazySQL binary
  get_url:
    url: "https://github.com/jorgerojas26/lazysql/releases/download/{{ lazysql_version.stdout }}/lazysql_Linux_x86_64.tar.gz"
    dest: "/tmp/lazysql.tar.gz"
    mode: '0644'
  become: false

- name: Create directory for LazySQL
  file:
    path: /tmp/lazysql_extracted
    state: directory
  become: false

- name: Unarchive LazySQL
  unarchive:
    src: "/tmp/lazysql.tar.gz"
    dest: "/tmp/lazysql_extracted"
    remote_src: yes
  become: false

- name: Install LazySQL binary to /usr/local/bin
  copy:
    src: "/tmp/lazysql_extracted/lazysql"
    dest: "/usr/local/bin/lazysql"
    mode: '0755'
    remote_src: yes
  become: true
