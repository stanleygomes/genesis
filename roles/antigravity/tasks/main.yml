---
- name: Remove legacy system-wide Antigravity desktop entries
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/applications/antigravity.desktop
    - /usr/share/applications/antigravity-ide.desktop
    - /usr/share/applications/antigravity-url-handler.desktop
  become: true

- name: Set download URLs based on architecture
  set_fact:
    antigravity_ide_url: "{{ 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.1-4861014005645312/linux-x64/Antigravity%20IDE.tar.gz' if ansible_architecture == 'x86_64' else 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.1-4861014005645312/linux-arm/Antigravity%20IDE.tar.gz' }}"
    antigravity_hub_url: "{{ 'https://storage.googleapis.com/antigravity-public/antigravity-hub/2.0.1-6566078776737792/linux-x64/Antigravity.tar.gz' if ansible_architecture == 'x86_64' else 'https://storage.googleapis.com/antigravity-public/antigravity-hub/2.0.1-6566078776737792/linux-arm/Antigravity.tar.gz' }}"

# === INSTALL ANTIGRAVITY IDE ===

- name: Ensure target Antigravity IDE installation directory is clean
  file:
    path: /usr/share/antigravity-ide
    state: absent
  become: true

- name: Create Antigravity IDE installation directory
  file:
    path: /usr/share/antigravity-ide
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Download and extract Antigravity IDE
  unarchive:
    src: "{{ antigravity_ide_url }}"
    dest: /usr/share/antigravity-ide
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
    owner: root
    group: root
  become: true

- name: Set permissions on Antigravity IDE chrome-sandbox
  file:
    path: /usr/share/antigravity-ide/chrome-sandbox
    mode: "4755"
    owner: root
    group: root
  become: true

- name: Create symlink in /usr/bin for Antigravity IDE
  file:
    src: /usr/share/antigravity-ide/bin/antigravity-ide
    dest: /usr/bin/antigravity-ide
    state: link
    force: yes
  become: true

- name: Copy Antigravity IDE icon to pixmaps
  copy:
    src: /usr/share/antigravity-ide/resources/app/resources/linux/code.png
    dest: /usr/share/pixmaps/antigravity-ide.png
    remote_src: yes
    mode: "0644"
  become: true

# === INSTALL ANTIGRAVITY (HUB) ===

- name: Ensure target Antigravity Hub installation directory is clean
  file:
    path: /usr/share/antigravity
    state: absent
  become: true

- name: Create Antigravity Hub installation directory
  file:
    path: /usr/share/antigravity
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Download and extract Antigravity Hub
  unarchive:
    src: "{{ antigravity_hub_url }}"
    dest: /usr/share/antigravity
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
    owner: root
    group: root
  become: true

- name: Set permissions on Antigravity Hub chrome-sandbox
  file:
    path: /usr/share/antigravity/chrome-sandbox
    mode: "4755"
    owner: root
    group: root
  become: true

- name: Create symlink in /usr/bin for Antigravity Hub
  file:
    src: /usr/share/antigravity/antigravity
    dest: /usr/bin/antigravity
    state: link
    force: yes
  become: true

- name: Extract Antigravity Hub icon from app.asar
  shell: |
    python3 -c '
    import struct, json
    with open("/usr/share/antigravity/resources/app.asar", "rb") as f:
        f.seek(12)
        size_header = struct.unpack("<I", f.read(4))[0]
        header = json.loads(f.read(size_header).decode("utf-8"))
        icon_info = header["files"]["icon.png"]
        f.seek(16 + size_header + int(icon_info["offset"]))
        data = f.read(int(icon_info["size"]))
        with open("/usr/share/pixmaps/antigravity.png", "wb") as out:
            out.write(data)
    '
  become: true

# === CONFIGURATIONS & EXTENSIONS ===

- name: Create User config directory
  file:
    path: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User"
    state: directory
    mode: "0755"
  become: false

- name: Sync Antigravity settings
  copy:
    src: "{{ playbook_dir }}/../configs/ide/settings.json"
    dest: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User/settings.json"
    mode: "0644"
  become: false

- name: Sync Antigravity keybindings
  copy:
    src: "{{ playbook_dir }}/../configs/ide/keybindings.json"
    dest: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User/keybindings.json"
    mode: "0644"
  become: false

- name: Read extensions list
  set_fact:
    extensions: "{{ lookup('file', playbook_dir + '/../configs/ide/extensions.txt').splitlines() }}"
  become: false

- name: Install Antigravity extensions
  shell: antigravity-ide --install-extension {{ item }}
  loop: "{{ extensions }}"
  become: false
  register: ext_install
  changed_when: "'is already installed' not in ext_install.stdout"
  ignore_errors: true
