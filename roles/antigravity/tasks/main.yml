---
- name: Set download URL based on architecture
  set_fact:
    antigravity_url: "{{ 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.1-4861014005645312/linux-x64/Antigravity%20IDE.tar.gz' if ansible_architecture == 'x86_64' else 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.1-4861014005645312/linux-arm/Antigravity%20IDE.tar.gz' }}"

- name: Ensure target installation directory is clean
  file:
    path: /usr/share/antigravity
    state: absent
  become: true

- name: Create installation directory
  file:
    path: /usr/share/antigravity
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Download and extract Antigravity IDE
  unarchive:
    src: "{{ antigravity_url }}"
    dest: /usr/share/antigravity
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
    owner: root
    group: root
  become: true

- name: Set permissions on chrome-sandbox
  file:
    path: /usr/share/antigravity/chrome-sandbox
    mode: "4755"
    owner: root
    group: root
  become: true

- name: Create symlink in /usr/bin for antigravity
  file:
    src: /usr/share/antigravity/bin/antigravity-ide
    dest: /usr/bin/antigravity
    state: link
    force: yes
  become: true

- name: Create fallback symlink /usr/share/antigravity-ide
  file:
    src: /usr/share/antigravity
    dest: /usr/share/antigravity-ide
    state: link
    force: yes
  become: true

- name: Copy Antigravity icon to pixmaps
  copy:
    src: /usr/share/antigravity/resources/app/resources/linux/code.png
    dest: /usr/share/pixmaps/antigravity.png
    remote_src: yes
    mode: "0644"
  become: true

- name: Create Antigravity desktop entry
  copy:
    dest: /usr/share/applications/antigravity-ide.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Antigravity
      Comment=Experience liftoff
      GenericName=Text Editor
      Exec=/usr/bin/antigravity %F
      Icon=antigravity
      Type=Application
      StartupNotify=false
      StartupWMClass=antigravity-ide
      Categories=TextEditor;Development;IDE;
      MimeType=application/x-antigravity-workspace;
      Actions=new-empty-window;
      Keywords=vscode;

      [Desktop Action new-empty-window]
      Name=New Empty Window
      Exec=/usr/bin/antigravity --new-window %F
      Icon=antigravity
  become: true

- name: Create Antigravity URL Handler desktop entry
  copy:
    dest: /usr/share/applications/antigravity-url-handler.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Antigravity - URL Handler
      Comment=Experience liftoff
      GenericName=Text Editor
      Exec=/usr/bin/antigravity --open-url %U
      Icon=antigravity
      Type=Application
      NoDisplay=true
      StartupNotify=true
      Categories=Utility;TextEditor;Development;IDE;
      MimeType=x-scheme-handler/antigravity;
      Keywords=vscode;
  become: true

- name: Create User config directory
  file:
    path: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User"
    state: directory
    mode: "0755"
  become: false

- name: Sync Antigravity settings
  copy:
    src: "{{ playbook_dir }}/../configs/ide/settings.json"
    dest: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User/settings.json"
    mode: "0644"
  become: false

- name: Sync Antigravity keybindings
  copy:
    src: "{{ playbook_dir }}/../configs/ide/keybindings.json"
    dest: "{{ ansible_env.HOME }}/.config/Antigravity IDE/User/keybindings.json"
    mode: "0644"
  become: false

- name: Read extensions list
  set_fact:
    extensions: "{{ lookup('file', playbook_dir + '/../configs/ide/extensions.txt').splitlines() }}"
  become: false

- name: Install Antigravity extensions
  shell: antigravity --install-extension {{ item }}
  loop: "{{ extensions }}"
  become: false
  register: ext_install
  changed_when: "'is already installed' not in ext_install.stdout"
  ignore_errors: true
