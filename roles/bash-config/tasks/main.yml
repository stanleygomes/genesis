---
- name: Install bat
  apt:
    name: bat
    state: present
    update_cache: yes
  become: true

- name: Install btop
  apt:
    name: btop
    state: present
    update_cache: yes
  become: true

- name: Create directory for eza key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add eza GPG key
  shell: curl -fsSL https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor --yes -o /etc/apt/keyrings/gierens.gpg
  become: true

- name: Add eza repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
    state: present
    filename: gierens
  become: true

- name: Install eza
  apt:
    name: eza
    state: present
    update_cache: yes
  become: true

- name: Install Dust binary
  shell: |
    DUST_VERSION=$(curl -s "https://api.github.com/repos/bootandy/dust/releases/latest" | grep -Po '"tag_name": "v\K[^"]*')
    if [ -z "$DUST_VERSION" ]; then
      echo "Failed to get dust version. Retrying with fallback version 1.2.4"
      DUST_VERSION="1.2.4"
    fi
    curl -sLo /tmp/dust.tar.gz "https://github.com/bootandy/dust/releases/download/v${DUST_VERSION}/dust-v${DUST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    cd /tmp
    tar xf dust.tar.gz
    install dust-v${DUST_VERSION}-x86_64-unknown-linux-gnu/dust /usr/local/bin
  args:
    executable: /bin/bash
    creates: /usr/local/bin/dust
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install zoxide
  apt:
    name: zoxide
    state: present
    update_cache: yes
  become: true

- name: Install fd-find
  apt:
    name: fd-find
    state: present
    update_cache: yes
  become: true

- name: Add personal aliases
  blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} PERSONAL ALIASES"
    block: |
      # Alias para abrir um novo terminal no diretório atual
      alias terminal='gnome-terminal --working-directory="$(pwd)" &'

      # Alias para o bat (no Ubuntu o comando é batcat)
      alias bat='batcat'

      # Alias para o eza (substituto moderno do ls)
      alias ls='eza --icons'
      alias ll='eza -lh --icons --grid --group-directories-first'
      alias la='eza -a --icons'
      alias lt='eza --tree --icons'

      # Alias para o dust (substituto moderno do du)
      alias du='dust'

      # Inicialização do zoxide (substituto inteligente para o cd)
      eval "$(zoxide init bash --cmd cd)"

      # Alias para o fd (substituto moderno do find)
      alias fd='fdfind'

      # Hermes Agent completions
      if command -v hermes &> /dev/null; then
        eval "$(hermes completion bash)"
      fi
    state: present
  become: false

- name: Add git branch parser and custom PS1
  blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} CUSTOM PROMPT (PS1)"
    block: |
      parse_git_branch() {
        git rev-parse --abbrev-ref HEAD 2>/dev/null | grep -v HEAD
      }

      export PS1="🚀  \[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$(branch=\$(parse_git_branch); [ -n \"\$branch\" ] && echo \" (\[\033[01;33m\]\$branch\[\033[00m\])\") \$ "
    state: present
  become: false

- name: Ensure SDKMAN is at the end of bashrc
  blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} SDKMAN CONFIGURATION"
    insertafter: EOF
    block: |
      #THIS MUST BE AT THE END OF THE FILE FOR SDKMAN TO WORK!!!
      export SDKMAN_DIR="$HOME/.sdkman"
      [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
    state: present
  become: false

- name: Check if gsettings is available
  command: which gsettings
  register: gsettings_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Set JetBrains Mono as the default monospace font
  command: gsettings set org.gnome.desktop.interface monospace-font-name 'JetBrains Mono 13'
  become: false
  when: gsettings_check.rc == 0
  ignore_errors: true

- name: Get default GNOME Terminal profile
  command: gsettings get org.gnome.Terminal.ProfilesList default
  register: terminal_profile
  become: false
  when: gsettings_check.rc == 0
  changed_when: false
  ignore_errors: true

- name: Set JetBrains Mono in GNOME Terminal
  shell: |
    PROFILE_ID={{ terminal_profile.stdout | replace("'", "") }}
    gsettings set org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles:/:${PROFILE_ID}/ use-system-font false
    gsettings set org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles:/:${PROFILE_ID}/ font 'JetBrains Mono 13'
  become: false
  when:
    - gsettings_check.rc == 0
    - terminal_profile.rc == 0
  ignore_errors: true
