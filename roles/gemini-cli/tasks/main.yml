---
- name: Install Gemini CLI globally
  shell: |
    bash -c "source {{ ansible_env.HOME }}/.nvm/nvm.sh && npm install -g @google/gemini-cli"
  args:
    executable: /bin/bash
  become: false
  register: gemini_install
  changed_when: "'added' in gemini_install.stdout or 'changed' in gemini_install.stdout or 'removed' in gemini_install.stdout"
