---
- name: Install dependencies for Hermes Agent
  apt:
    name:
      - curl
      - git
      - build-essential
      - python3-dev
      - python3-venv
      - pkg-config
      - libssl-dev
    state: present
    update_cache: yes
  become: true

- name: Check if hermes is installed
  command: which hermes
  register: hermes_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install Hermes Agent
  shell: curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash -s -- --skip-setup
  args:
    executable: /bin/bash
  when: hermes_check.rc != 0
  become: false
