---
- name: Check if uv is installed
  stat:
    path: "{{ ansible_env.HOME }}/.local/bin/uv"
  register: uv_stat
  become: false

- name: Install uv via official script
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  when: not uv_stat.stat.exists
  become: false
  args:
    executable: /bin/bash

- name: Ensure uv is in bashrc
  lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: present
  become: false

- name: Install recommended Python version (3.14)
  shell: |
    export PATH="{{ ansible_env.HOME }}/.local/bin:$PATH"
    uv python install 3.14
  become: false
  register: python_install
  changed_when: "'Installed' in python_install.stdout"
