---
- name: Install Git
  apt:
    name: git
    state: present
  become: true

- name: Configure Git User Name
  git_config:
    name: user.name
    value: "{{ git_user_name }}"
    scope: global
  become: false

- name: Configure Git User Email
  git_config:
    name: user.email
    value: "{{ git_user_email }}"
    scope: global
  become: false
