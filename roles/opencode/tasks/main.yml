---
- name: Check if OpenCode binary exists
  stat:
    path: "{{ opencode_install_dir }}/opencode"
  register: opencode_bin_check
  become: false

- name: Check if OpenCode symlink exists in /usr/local/bin
  stat:
    path: /usr/local/bin/opencode
  register: opencode_usr_check
  become: false

- name: Install OpenCode via official installer
  shell: curl -fsSL https://opencode.ai/install | bash
  become: false
  when: not opencode_bin_check.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure /usr/local/bin exists
  file:
    path: /usr/local/bin
    state: directory
    mode: '0755'
  become: true
  when: not opencode_usr_check.stat.exists

- name: Symlink OpenCode to /usr/local/bin
  file:
    src: "{{ opencode_install_dir }}/opencode"
    dest: /usr/local/bin/opencode
    state: link
  become: true
  when: not opencode_usr_check.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"
