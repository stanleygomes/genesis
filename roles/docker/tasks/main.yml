---
- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install dependencies for Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - util-linux-extra
    state: present
    update_cache: yes
  when: docker_check.rc != 0

- name: Create directory for Docker key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: docker_check.rc != 0

- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: docker_check.rc != 0

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: docker_check.rc != 0

- name: Install Docker Engine and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: docker_check.rc != 0

- name: Check if docker group exists
  shell: getent group docker
  register: docker_group_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Create docker group
  group:
    name: docker
    state: present
  when: docker_group_check.rc != 0

- name: Add user to docker group
  user:
    name: "{{ docker_user }}"
    groups: docker
    append: yes
  register: user_group_update
  when: docker_group_check.rc != 0

- name: Reset connection to apply group changes
  meta: reset_connection
  when: docker_group_check.rc != 0 and user_group_update.changed

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes
  become: true
